<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salas y Sofás — Ansulais</title>
<link rel="icon" type="image/svg+xml" href="assets/logosimplificado.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --beige: #f8f2de;
    --beige-tint: #fdfbf3;
    --beige-light: #fdf8ec;
    --maroon: #1a1a1a;
    --maroon-deep: #0f0f0f;
    --maroon-hover: #2b2b2b;
    --navy: #0c1a29;
    --wood: #8a5a35;
    --ink: #241a12;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    overflow-x: hidden;
  }

  body {
    padding-top: 82px;
    background: var(--beige-light);
    color: var(--ink);
    font-family: 'Montserrat', 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; border: none; background: none; cursor: pointer; }

  .wrap {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 48px;
  }

  /* ---------- NAV ---------- */
  header.nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: var(--maroon-deep);
    padding: 18px 0;
  }

  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--beige-light);
  }

  .logo-icon {
    display: block;
    height: 34px;
    width: auto;
    flex-shrink: 0;
  }

  .logo-icon svg {
    display: block;
    height: 100%;
    width: auto;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 40px;
  }

  .nav-links a {
    font-size: 15px;
    font-weight: 500;
    color: var(--beige-light);
    opacity: 0.7;
    transition: opacity 0.2s ease;
  }

  .nav-links a:hover {
    opacity: 1;
  }

  .nav-links a.is-featured {
    opacity: 1;
    font-weight: 700;
    color: var(--beige-light);
    position: relative;
    padding-bottom: 2px;
  }

  .nav-links a.is-featured::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -6px;
    height: 2px;
    background: var(--beige-light);
    border-radius: 2px;
  }

  .nav-search {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    background: rgba(253, 248, 236, 0.08);
    border: 1px solid rgba(253, 248, 236, 0.18);
    border-radius: 100px;
    padding: 6px 6px 6px 16px;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .nav-search:focus-within {
    border-color: rgba(253, 248, 236, 0.4);
    background: rgba(253, 248, 236, 0.12);
  }

  .nav-search input {
    width: 140px;
    background: none;
    border: none;
    outline: none;
    color: var(--beige-light);
    font-family: inherit;
    font-size: 14px;
  }

  .nav-search input::placeholder {
    color: var(--beige-light);
    opacity: 0.5;
  }

  .nav-search button {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--beige-light);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s ease;
  }

  .nav-search button:hover {
    background: var(--beige);
  }

  .nav-search button svg {
    width: 15px;
    height: 15px;
    color: var(--maroon-deep);
  }

  .whatsapp-float {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 50;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--beige-light);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 14px 30px -10px rgba(0, 0, 0, 0.45);
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .whatsapp-float:hover {
    background: var(--beige);
    transform: translateY(-3px);
  }

  .whatsapp-float svg {
    width: 28px;
    height: 28px;
    fill: var(--maroon-deep);
  }

  .menu-toggle {
    display: none;
  }

  /* ---------- FILTERS ---------- */
  .catalog-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 28px 0 8px;
  }

  .filter-btn {
    padding: 10px 20px;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    background: var(--beige-tint);
    border: 1px solid rgba(26, 26, 26, 0.1);
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .filter-btn:hover {
    border-color: rgba(26, 26, 26, 0.25);
  }

  .filter-btn.is-active {
    background: var(--maroon);
    color: var(--beige-light);
    border-color: var(--maroon);
  }

  /* ---------- GRID ---------- */
  .catalog-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 26px;
    padding: 36px 0 110px;
  }

  .product-card {
    display: block;
    width: 100%;
    text-align: left;
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 14px 30px -20px rgba(26, 26, 26, 0.3);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .product-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 22px 40px -18px rgba(26, 26, 26, 0.35);
  }

  .product-card.is-hidden {
    display: none;
  }

  .product-card-media {
    display: block;
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--beige-tint);
  }

  .product-card-media img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }

  .product-card:hover .product-card-media img {
    transform: scale(1.06);
  }

  .product-card-count {
    position: absolute;
    right: 12px;
    bottom: 12px;
    background: rgba(15, 15, 15, 0.6);
    color: var(--beige-light);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 100px;
    backdrop-filter: blur(2px);
  }

  .product-card-info {
    display: block;
    padding: 16px 18px 20px;
  }

  .product-card-info h3 {
    font-size: 16px;
    font-weight: 700;
    color: var(--maroon);
    letter-spacing: -0.01em;
    line-height: 1.3;
  }

  .product-card-tag {
    display: inline-block;
    margin-top: 8px;
    font-size: 12px;
    font-weight: 600;
    opacity: 0.55;
    text-transform: capitalize;
  }

  /* ---------- LIGHTBOX ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    align-items: safe center;
    justify-content: center;
    overflow-y: auto;
    padding: 70px 24px 30px;
    background: rgba(10, 10, 10, 0.92);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .lightbox.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  .lightbox-inner {
    position: relative;
    width: 100%;
    max-width: 880px;
    margin: auto;
  }

  .lightbox-close {
    position: fixed;
    top: 18px;
    right: 24px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(253, 248, 236, 0.12);
    color: var(--beige-light);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
  }

  .lightbox-close:hover { background: rgba(253, 248, 236, 0.22); }
  .lightbox-close svg { width: 18px; height: 18px; }

  .lightbox-media {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    overflow: hidden;
    background: var(--beige-tint);
  }

  .lightbox-media img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .lightbox-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(253, 248, 236, 0.9);
    color: var(--maroon-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .lightbox-arrow:hover { background: #fff; }
  .lightbox-arrow svg { width: 20px; height: 20px; }
  .lightbox-prev { left: 14px; }
  .lightbox-next { right: 14px; }

  .lightbox-caption {
    margin-top: 18px;
    color: var(--beige-light);
  }

  .lightbox-caption-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .lightbox-caption h3 {
    font-size: 18px;
    font-weight: 700;
  }

  .lightbox-caption-top span {
    font-size: 13px;
    opacity: 0.6;
    flex-shrink: 0;
  }

  .lightbox-code {
    display: block;
    margin-top: 4px;
    font-size: 13px;
    opacity: 0.55;
    letter-spacing: 0.02em;
  }

  .lightbox-whatsapp {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    padding: 13px 22px;
    border-radius: 100px;
    background: var(--beige-light);
    color: var(--maroon-deep);
    font-size: 14px;
    font-weight: 700;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .lightbox-whatsapp:hover {
    background: var(--beige);
    transform: translateY(-2px);
  }

  .lightbox-whatsapp svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  /* ---------- FOOTER ---------- */
  .site-footer {
    position: relative;
    z-index: 3;
    background: var(--maroon-deep);
    color: var(--beige-light);
    padding-top: 80px;
  }

  .footer-top {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr;
    gap: 60px;
    padding-bottom: 60px;
  }

  .footer-logo-icon {
    display: block;
    width: 40px;
    height: 40px;
    margin-bottom: 20px;
  }

  .footer-logo-icon svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .footer-tagline {
    font-size: 15px;
    line-height: 1.5;
    opacity: 0.75;
    max-width: 320px;
    margin-bottom: 24px;
  }

  .social-links {
    display: flex;
    align-items: center;
    gap: 18px;
    color: var(--beige-light);
  }

  .social-links a {
    display: flex;
    width: 34px;
    height: 34px;
    opacity: 0.85;
    transition: opacity 0.2s ease;
  }

  .social-links a:hover { opacity: 1; }

  .social-links svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .footer-col h4 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.55;
    margin-bottom: 18px;
  }

  .footer-col a,
  .footer-col p {
    display: block;
    color: var(--beige-light);
    opacity: 0.8;
    font-size: 15px;
    line-height: 1.9;
    transition: opacity 0.2s ease;
  }

  .footer-col a:hover { opacity: 1; }

  .footer-bottom {
    border-top: 1px solid rgba(253, 248, 236, 0.12);
    padding: 24px 0 32px;
    text-align: center;
    font-size: 13px;
    opacity: 0.5;
  }

  /* ---------- SCROLL REVEAL ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(36px);
    transition: opacity 0.8s cubic-bezier(.22,.61,.36,1), transform 0.8s cubic-bezier(.22,.61,.36,1);
  }

  .reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  .reveal-delay-1 { transition-delay: 0.08s; }
  .reveal-delay-2 { transition-delay: 0.16s; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 900px) {
    .wrap { padding: 0 24px; }

    .nav-inner {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .logo { justify-self: center; }

    .menu-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      justify-self: start;
      width: 34px;
      height: 34px;
      flex-shrink: 0;
    }

    .menu-toggle svg {
      width: 24px;
      height: 24px;
      stroke: var(--beige-light);
    }

    .nav-search {
      justify-self: end;
      padding: 6px;
      border: none;
      background: none;
    }

    .nav-search input { display: none; }

    .whatsapp-float {
      right: 16px;
      bottom: 16px;
      width: 52px;
      height: 52px;
    }

    .nav-links {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      flex-direction: column;
      align-items: flex-start;
      gap: 22px;
      background: var(--maroon-deep);
      padding: 26px 24px 30px;
      border-top: 1px solid rgba(253, 248, 236, 0.12);
    }

    .nav-links.open { display: flex; }

    .nav-links a { font-size: 17px; }

    .catalog-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      padding: 24px 0 70px;
    }

    .product-card-info { padding: 12px 14px 16px; }
    .product-card-info h3 { font-size: 14px; }

    .lightbox-arrow { width: 38px; height: 38px; }
    .lightbox-arrow svg { width: 16px; height: 16px; }
    .lightbox-prev { left: 4px; }
    .lightbox-next { right: 4px; }
    .lightbox-close { top: 12px; right: 12px; }

    .lightbox { padding: 60px 16px 24px; }

    .site-footer { padding-top: 56px; }

    .footer-top {
      grid-template-columns: 1fr;
      gap: 40px;
      padding-bottom: 40px;
    }
  }

  @media (max-width: 560px) {
    .catalog-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  }
</style>
</head>

    var tagLabels = { sofa: "Sofá", "en-l": "Sala en L", cama: "Sofá cama" };
    var basePath = "assets/catalogo/salas/";

    function imgPath(product, imageName) {
      return basePath + product.folder + "/" + imageName + ".jpg";
    }

    var grid = document.getElementById("catalogGrid");

    products.forEach(function (product, index) {
      var card = document.createElement("button");
      card.className = "product-card reveal reveal-delay-" + ((index % 3 === 0) ? 0 : (index % 2 === 0 ? 2 : 1));
      card.type = "button";
      card.dataset.tag = product.tag;
      card.setAttribute("aria-label", "Ver fotos de " + product.name);
      card.innerHTML =
        '<span class="product-card-media">' +
          '<img src="' + imgPath(product, product.images[0]) + '" alt="' + product.name + '" loading="lazy">' +
          '<span class="product-card-count">' + product.images.length + ' fotos</span>' +
        '</span>' +
        '<span class="product-card-info">' +
          '<h3>' + product.name + '</h3>' +
          '<span class="product-card-tag">' + tagLabels[product.tag] + '</span>' +
        '</span>';
      card.addEventListener("click", function () { openLightbox(index); });
      grid.appendChild(card);
    });

    document.querySelectorAll(".reveal").forEach(function (el) {
      revealObserver.observe(el);
    });

    // ---------- Filters ----------
    var filterButtons = document.querySelectorAll(".filter-btn");
    filterButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        filterButtons.forEach(function (b) { b.classList.remove("is-active"); });
        btn.classList.add("is-active");
        var filter = btn.dataset.filter;
        document.querySelectorAll(".product-card").forEach(function (card) {
          card.classList.toggle("is-hidden", filter !== "all" && card.dataset.tag !== filter);
        });
      });
    });

    // ---------- Lightbox ----------
    var WHATSAPP_NUMBER = "573004928400";
    var lightbox = document.getElementById("lightbox");
    var lightboxImage = document.getElementById("lightboxImage");
    var lightboxTitle = document.getElementById("lightboxTitle");
    var lightboxCounter = document.getElementById("lightboxCounter");
    var lightboxCode = document.getElementById("lightboxCode");
    var lightboxWhatsapp = document.getElementById("lightboxWhatsapp");
    var currentProductIndex = 0;
    var currentImageIndex = 0;

    function articleCode(index) {
      var n = String(index + 1);
      while (n.length < 2) n = "0" + n;
      return "SAL-" + n;
    }

    function renderLightbox() {
      var product = products[currentProductIndex];
      var code = articleCode(currentProductIndex);
      lightboxImage.src = imgPath(product, product.images[currentImageIndex]);
      lightboxImage.alt = product.name;
      lightboxTitle.textContent = product.name;
      lightboxCounter.textContent = (currentImageIndex + 1) + " / " + product.images.length;
      lightboxCode.textContent = "Artículo " + code;

      var message = "Hola, quiero más información sobre el artículo " + code + " (" + product.name + ").";
      lightboxWhatsapp.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(message);
    }

    function openLightbox(productIndex) {
      currentProductIndex = productIndex;
      currentImageIndex = 0;
      renderLightbox();
      lightbox.classList.add("is-open");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightbox.classList.remove("is-open");
      document.body.style.overflow = "";
    }

    function showNextImage() {
      var product = products[currentProductIndex];
      currentImageIndex = (currentImageIndex + 1) % product.images.length;
      renderLightbox();
    }

    function showPrevImage() {
      var product = products[currentProductIndex];
      currentImageIndex = (currentImageIndex - 1 + product.images.length) % product.images.length;
      renderLightbox();
    }

    document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
    document.getElementById("lightboxNext").addEventListener("click", showNextImage);
    document.getElementById("lightboxPrev").addEventListener("click", showPrevImage);
    lightbox.addEventListener("click", function (e) {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener("keydown", function (e) {
      if (!lightbox.classList.contains("is-open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowRight") showNextImage();
      if (e.key === "ArrowLeft") showPrevImage();
    });

    var menuToggle = document.getElementById('menuToggle');
    var navLinks = document.getElementById('navLinks');
    menuToggle.addEventListener('click', function () {
      var isOpen = navLinks.classList.toggle('open');
      menuToggle.setAttribute('aria-expanded', isOpen);
    });
    navLinks.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () {
        navLinks.classList.remove('open');
        menuToggle.setAttribute('aria-expanded', 'false');
      });
    });
  </script>
